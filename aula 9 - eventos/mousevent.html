<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>DOM</title>
</head>
<body>
    <h1 id="titulo">Título Original</h1>
    <p style = "background-color: blue;" id="paragrafo">Este é um parágrafo.</p>
    <button id="botao">Clique aqui para trocar o texto</button>

    <script>
        document.getElementById("titulo").textContent = "Novo Título";
        document.getElementById("paragrafo").style.color = "white";
        document.getElementById("botao").addEventListener("mouseover", function() {
            document.getElementById("botao").style.borderColor = "red";
        });
    </script>
</body>
</html>
