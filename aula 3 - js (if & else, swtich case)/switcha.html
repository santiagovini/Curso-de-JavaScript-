<!DOCTYPE html>
<html>
<head>
    <title>Uso de switch</title>

    <script type="text/javascript">
        function checar() {
            var dia = parseInt(document.getElementById("day").value);

            switch (dia) {
                case 1: alert("Domingo"); break;
                case 2: alert("Segunda-feira"); break;
                case 3: alert("Terça-feira"); break;
                case 4: alert("Quarta-feira"); break;
                case 5: alert("Quinta-feira"); break;
                case 6: alert("Sexta-feira"); break;
                case 7: alert("Sábado"); break;
                default: alert("Dia inválido");
            }
        }
    </script>
</head>

<body>
    Dia da semana: <input id="day" type="number"><br><br>
    <button onclick="checar()">Checar</button>
</body>
</html>
