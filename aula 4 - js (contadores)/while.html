<!DOCTYPE html>
<html lang="en">
<head>
   <title>Curso JavaScript Progressivo</title>
</head>

<body>
    <script>
        let senha;
        do {
            senha = prompt("Digite a senha:");
        } 
        while (senha != "1234");
        alert("Senha correta");

    if (!senha)
        alert("Senha Incorreta");
    </script>
</body>
</html>
